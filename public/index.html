<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rat's Kitchen</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- LANDING -->
<section id="landing" class="screen">
  <div class="brand">
    <div class="brand-rat">🐀</div>
    <h1>Rat's Kitchen</h1>
    <p class="tagline">Combined · playtest build</p>
  </div>
  <input id="nameInput" class="field" maxlength="14" placeholder="Your name" autocomplete="off">
  <button id="createBtn" class="btn btn-primary btn-block">Create room</button>
  <div class="divider"><span>or join</span></div>
  <input id="codeInput" class="field field-code" maxlength="4" placeholder="CODE"
         autocomplete="off" autocapitalize="characters" inputmode="text">
  <button id="joinBtn" class="btn btn-block">Join room</button>
  <p id="landingError" class="error"></p>
</section>

<!-- LOBBY -->
<section id="lobby" class="screen hidden">
  <div class="lobby-head">
    <p class="label">Room code</p>
    <div id="lobbyCode" class="code-display"></div>
    <p class="hint">Others join with this code. 2–8 players, bots fill the rest.</p>
  </div>
  <div id="seatList" class="seat-list"></div>
  <div class="lobby-actions">
    <button id="addBotBtn" class="btn btn-block">+ Add bot</button>
    <button id="startBtn" class="btn btn-primary btn-block">Start game</button>
  </div>
  <p id="lobbyError" class="error"></p>
  <p class="hint" id="hostHint"></p>
</section>

<!-- GAME -->
<section id="game" class="screen hidden">
  <header id="turnBar" class="turn-bar"></header>
  <div id="kitchens" class="kitchens"></div>
  <div id="logToggleWrap">
    <button id="logToggle" class="btn btn-ghost btn-small">Show log</button>
  </div>
  <div id="log" class="log hidden"></div>
  <div class="hand-dock">
    <div id="handMeta" class="hand-meta"></div>
    <div id="hand" class="hand"></div>
    <button id="endTurnBtn" class="btn btn-primary btn-block">End turn</button>
  </div>
</section>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <p id="modalBody" class="modal-body"></p>
    <div id="modalOptions" class="modal-options"></div>
    <button id="modalCancel" class="btn btn-ghost btn-block">Cancel</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
</html>
